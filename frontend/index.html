<!doctype html>

<!-- 문서의 기본 언어는 한국어 -->
<html lang="ko">
  <head>
    <!-- 문서 인코딩을 UTF-8로 지정 -->
    <meta charset="UTF-8" />
    
    <!-- 브라우저 탭에 보이는 파비콘(favicon)을 지정 -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- 반응형 웹의 핵심 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 실제 적용은 CSS에서 font-family: 'Poppins', 'Noto Sans KR', sans-serif; 처럼 명시해야 함 -->
    <!-- 숫자·영문 Poppins 글꼴 -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet" />
    <!-- 한글 Noto Sans KR 글꼴 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700&display=swap" rel="stylesheet" />

    <!-- 브라우저 탭 제목 -->
    <title>마켓스테이지</title>
  </head>
  <body>
    <!-- React가 마운트(컴포넌트를 최초로 화면에 붙이는 순간 -> 최초 렌더링)될 자리 
     main.tsx에서 이 엘리먼트를 찾아 <App />을 꽂아 넣는다. -->
    <div id="root"></div>

    <!-- 애플리케이션 진입점을 로드 -->
    <!-- 여기서 main.tsx가 실행된다. -->
    <!-- index.html -> main.tsx -> App.tsx 순서로 실행된다. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
