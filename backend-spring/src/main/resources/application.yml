# resources/application.yml
# 스프링 부트 서버 전체 환경설정(포트, DB, 메일, JWT, CORS, S3, 커스텀 설정)을 한 곳에 모아둔 설정 파일


# 1. 스프링 부트가 내부적으로 띄우는 내장 톰캣 서버의 기본 설정들을 모아놓는 블럭
server:

  # (1) 백엔드 서버가 열리는 포트 번호
  port: 8080

  # (2) 프록시/터널 뒤에 있을 때 헤더 처리
  forward-headers-strategy: framework

  # (3) 세션/쿠키 관련 보안 설정
  servlet:
    session:
      cookie:
        same-site: None
        secure: true

# 2. 스프링 부트에서 미리 약속해 둔 공식 설정 공간
spring:

  # (1) 지금 실행 시에 어떤 환경(profile) 으로 돌릴지 정하는 부분
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # (2) DB 연결 정보: 어떤 DB를 어떤 주소/드라이버로 연결할지
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${DB_PATH:./db.sqlite3}

  # (3) JPA + Hibernate 설정 모음
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
    open-in-view: false
    show-sql: false

  # (4) Flyway 마이그레이션 도구 설정
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # (5) SMTP 설정
  mail:
    host: smtp.naver.com
    port: 465
    username: ${SPRING_MAIL_USERNAME:${NAVER_USER:}}
    password: ${SPRING_MAIL_PASSWORD:${NAVER_APP_PASS:}}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 15000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
    default-encoding: UTF-8

  # (6) 시간대 / 로케일
  jackson:
    time-zone: Asia/Seoul  # JSON 직렬화/역직렬화 시 기준 타임존
  mvc:
    locale: ko_KR          # 웹 레이어의 기본 로케일(언어/문화권)

  # (7) JWT 검증 키
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:change-me}

# 3. 우리 비즈니스 로직이 필요로 하는 설정값들을 한 군데에 모아놓은 공간
app:

  # (1) CORS 허용 도메인/메서드 설정: SecurityConfig 안의 CorsConfigurationSource에서 이 값들을 읽어서 CORS 정책을 세팅할 때 사용
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.trycloudflare.com}
    allow-credentials: true
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    max-age: 3600
  
  # (2) 아이디/이메일 사전검사 토큰 설정
  precheck:
    secret: ${APP_PRECHECK_SECRET:change-me}  # 프리체크 서명키
    ttl-seconds: 600                          # 코드에서 @Value로 주입받아 사용

  # (3) 회원가입 허용 이메일 도메인
  allowed-email-domains: ${APP_ALLOWED_EMAIL_DOMAINS:gmail.com,naver.com,kakao.com}

  # (4) 기존 코드 호환용 프론트 URL
  frontend-base-url: ${FRONTEND_BASE_URL:http://127.0.0.1:5173}

  # (5) MailService에서 사용하는 메일 관련 설정
  mail:
    from: ${APP_MAIL_FROM:}
    host: ${SPRING_MAIL_HOST:smtp.naver.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:${NAVER_USER:}}
    password: ${SPRING_MAIL_PASSWORD:${NAVER_APP_PASS:}}

  # (6) 비밀번호 재설정 링크용 프론트 URL/경로
  frontend:
    base-url: ${APP_MAIL_FRONTEND_BASE_URL:${FRONTEND_BASE_URL:http://127.0.0.1:5173}}
    password-reset-path: ${APP_MAIL_RESET_PATH:/change-password}

  # (7) JWT 발급 관련 설정 (JwtIssuerImpl과 연결)
  jwt:
    secret: ${JWT_SECRET:change-me}
    issuer: marketstage
    audience: marketstage
    access-minutes: ${APP_JWT_ACCESS_MINUTES:30}      # Access 토큰 유효기간(분)
    refresh-minutes: ${APP_JWT_REFRESH_MINUTES:60}    # Refresh 토큰 유효기간(분)
    user-id-claim: user_seq                           # 토큰에 담을 사용자 식별자 클레임 키

  # (8) 비밀번호 해시 강도 설정
  security:
    password:
      bcrypt-strength: 12    # AppConfig.passwordEncoder()와 연결(미지정 시 12). 값이 클수록 해시 연산이 느려지고, 그만큼 브루트포스 공격에 강해짐

  # (9) 시간 관련 설정 (테스트용까지 포함)
  clock:
    zone: Asia/Seoul         # AppConfig.clock()과 연결(기본 Asia/Seoul)
    fixed: false             # false -> 실제 현재 시간 사용

  # (10) 인증 관련 디버그 플래그
  auth:
    debug-expose-temp-password: ${APP_AUTH_DEBUG_EXPOSE_TEMP_PASSWORD:false} # 비밀번호 찾기 시 발급된 임시 비밀번호를 응답 JSON에 그대로 노출할지 여부 같은 디버그용 옵션으로 쓰기 위한 값

# 4. AWS 관련 설정을 한 군데에 모아둔 설정
aws:

  # (1) AWS 리전
  region: ${AWS_REGION:ap-northeast-2}

  # (2) 사용할 S3 버킷 이름
  s3:
    # 로컬/테스트 기본 버킷 이름
    bucket: ${AWS_S3_BUCKET:company-site-media-dev}

  # (3) S3 접근용 AWS 액세스 키/시크릿 키
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

  # (4) S3 파일을 외부에 보여줄 때 앞에 붙일 도메인
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN:localhost}