# resources/application.yml
# 파이썬 장고로 치면 config/settings.py의 대부분에 해당된다.

# 애플리케이션이 8080 포트에서 HTTP 요청을 받도록 설정
server:
  port: 8080

spring:
  datasource:
    # 환경변수 DB_PATH로 SQLite 파일 경로 주입 (예: C:/Projects/company-site/backend-django/db.sqlite3)
    # foreign_keys=on 옵션으로 FK 제약 활성화
    url: jdbc:sqlite:${DB_PATH}?foreign_keys=on

    driver-class-name: org.sqlite.JDBC
    hikari:
      connectionInitSql: PRAGMA foreign_keys=ON;

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none            
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
        globally_quoted_identifiers: true
        jdbc.time_zone: Asia/Seoul
  
  # JSON 직렬화/역직렬화 시 KST(Asia/Seoul) 기준으로 처리
  jackson:
    time-zone: Asia/Seoul

  # Flyway(데이터베이스 마이그레이션 도구) => 지금은 쓰지 않음. 나중에 도입 시 true + 스크립트 추가
  flyway:
    enabled: false

# Hibernate가 실행하는 SQL문과 바인딩 값(파라미터)을 로그로 보여달라는 설정
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
