# resources/application.yml
# 파이썬 장고로 치면 config/settings.py의 대부분에 해당된다.

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: None
        secure: true

spring:
  profiles:
    active: local

  # === DB (SQLite) ===
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${DB_PATH:./db.sqlite3}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
    open-in-view: false
    show-sql: false

  # === Flyway ===
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # === Mail (Naver SMTP) ===
  mail:
    host: smtp.naver.com
    port: 465
    # SPRING_MAIL_*가 있으면 우선 사용, 없으면 NAVER_* 사용
    username: ${SPRING_MAIL_USERNAME:${NAVER_USER:}}
    password: ${SPRING_MAIL_PASSWORD:${NAVER_APP_PASS:}}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 15000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
    default-encoding: UTF-8

  # === 시각/로케일 ===
  jackson:
    time-zone: Asia/Seoul
  mvc:
    locale: ko_KR

  # JWT 리소스 서버 검증을 맡길 때
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:change-me}

# === 앱 커스텀 프로퍼티 ===
app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
    allowed-origin-patterns:
      - https://*.trycloudflare.com
    allow-credentials: true
    allowed-methods: [ GET, POST, PUT, PATCH, DELETE, OPTIONS ]
    allowed-headers: [ "*" ]
    max-age: 3600

  precheck:
    secret: ${APP_PRECHECK_SECRET:change-me}  # 프리체크 서명키
    ttl-seconds: 600                          # 코드에서 @Value로 주입받아 사용

  # 이메일 허용 도메인: 쉼표 구분 문자열
  allowed-email-domains: ${APP_ALLOWED_EMAIL_DOMAINS:gmail.com,naver.com,kakao.com}

  frontend-base-url: ${FRONTEND_BASE_URL:http://127.0.0.1:5173}

  # (참고) JWT 수명: 실제 발급은 JwtIssuer 구현체 기준
  jwt:
    access-minutes: 30
    refresh-minutes: 60
    user-id-claim: user_seq

# === S3/CloudFront ===
aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN:}
